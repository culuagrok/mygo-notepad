name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: ubuntu-latest, platform: "windows/amd64" }
          - { name: linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
          - { name: macos, os: macos-latest, platform: "darwin/universal" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}" -skip-notarize
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          V="$GITHUB_REF_NAME"
          mkdir -p dist
          find build -maxdepth 2 | sort
          # Release rule: only zip archives named *-portable.zip; never bare binaries.
          case "${{ matrix.name }}" in
            windows)
              (cd build/windows-amd64 && zip -r "../../dist/Notepad-$V-windows-amd64-portable.zip" .)
              ;;
            linux)
              for a in amd64 arm64; do
                (cd build && zip -ry "../dist/Notepad-$V-linux-$a-portable.zip" "linux-$a" -x '*.deb' '*.tar.gz')
              done
              ;;
            macos)
              ditto -c -k --sequesterRsrc --keepParent build/darwin-universal/Notepad.app "dist/Notepad-$V-macos-universal-portable.zip"
              ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/*-portable.zip
