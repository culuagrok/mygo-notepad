name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows exe
        run: |
          set -e
          mkdir -p dist
          if go tool mygo build -platform windows/amd64; then
            cp build/windows-amd64/Notepad.exe dist/Notepad.exe
          else
            echo "mygo CLI build failed; falling back to go build"
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-H windowsgui" -o dist/Notepad.exe .
          fi
          cd dist && zip -j "Notepad-${GITHUB_REF_NAME}-windows-amd64.zip" Notepad.exe
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            dist/Notepad.exe "dist/Notepad-${GITHUB_REF_NAME}-windows-amd64.zip"
